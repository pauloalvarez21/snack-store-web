<header class="app-header">
  <a class="brand" routerLink="/catalogo" aria-label="Snack Store — inicio">
    <span class="brand-logo" aria-hidden="true">🛍️</span>
    <span class="brand-name">Snack<span class="brand-accent">Store</span></span>
  </a>

  <nav class="app-nav" aria-label="Navegación principal">
    <a routerLink="/catalogo" routerLinkActive="active" class="nav-link">Catálogo</a>
  </nav>

  <div class="header-actions">
    @if (auth.isAuthenticated()) {
      <div class="user-chip" title="Sesión iniciada">
        <span class="user-avatar" aria-hidden="true">{{ auth.user()?.firstName?.charAt(0) ?? 'U' }}</span>
        <span class="user-name">{{ auth.user()?.firstName }} {{ auth.user()?.lastName }}</span>
        <button class="logout-btn" type="button" (click)="auth.logout()">Salir</button>
      </div>
    } @else {
      <a routerLink="/auth" class="login-link">Ingresar</a>
    }
    <button
      class="cart-button"
      type="button"
      (click)="cart.open.set(true)"
      aria-label="Abrir carrito"
    >
      <span class="cart-icon" aria-hidden="true">🛒</span>
      <span class="cart-badge" [class.visible]="cart.count() > 0">{{ cart.count() }}</span>
    </button>
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>

@if (cart.open()) {
  <app-cart-drawer />
}
