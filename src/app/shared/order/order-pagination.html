@if (totalPages() > 1) {
  <nav class="pagination" [attr.aria-label]="label()">
    <button class="page-btn" type="button" [disabled]="page() === 1" (click)="goTo(page() - 1)">
      ← Anterior
    </button>
    <div class="page-numbers">
      @for (p of pages(); track p) {
        <button class="page-btn number" type="button" [class.active]="p === page()" (click)="goTo(p)">
          {{ p }}
        </button>
      }
    </div>
    <button
      class="page-btn"
      type="button"
      [disabled]="page() === totalPages()"
      (click)="goTo(page() + 1)"
    >
      Siguiente →
    </button>
  </nav>
}
