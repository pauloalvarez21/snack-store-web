<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Snack Store — Comestibles en línea</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <script>
    // Aplica el tema antes del primer render para evitar un destello de modo claro.
    (function () {
      try {
        var saved = localStorage.getItem('snack_store_theme') || 'system';
        var dark =
          saved === 'dark' ||
          (saved === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        /* ignore */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
